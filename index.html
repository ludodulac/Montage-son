<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0d0e11"><title>Montage Son</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d0e11;color:#f8f8fa;font:15px system-ui,-apple-system,sans-serif;overscroll-behavior:none}button,input{font:inherit}button{border:0;color:inherit;touch-action:manipulation}.app{max-width:760px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 12px calc(150px + env(safe-area-inset-bottom))}header{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:850}.export{min-height:44px;padding:0 15px;border-radius:15px;background:#775cff;font-weight:800}.time{text-align:center;font-size:29px;font-weight:800;font-variant-numeric:tabular-nums;margin:3px 0 9px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.quick button{min-height:48px;border-radius:14px;background:#23252b;font-weight:750}.timeline{position:relative;background:#16181d;border-radius:18px;padding:12px 10px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x}.canvas{position:relative;min-width:100%;width:100%;transition:width .15s}.ruler{height:27px;display:flex;justify-content:space-between;color:#888e99;font-size:11px;border-bottom:1px solid #30333b}.playhead{position:absolute;left:0;top:5px;bottom:5px;width:2px;background:#fff;z-index:9;pointer-events:none}.playhead:before{content:"";position:absolute;left:-6px;border:7px solid transparent;border-top-color:#fff}.track{margin-top:13px}.head{display:flex;justify-content:space-between;align-items:center;height:28px;font-size:13px;font-weight:800}.lane{height:70px;background:#252830;border-radius:12px;position:relative;overflow:visible}.clip{position:absolute;top:5px;height:60px;min-width:52px;border-radius:11px;background:#785cff;padding:0 12px;display:flex;align-items:center;overflow:hidden;font-weight:800;box-shadow:0 3px 12px #0005;touch-action:none}.clip.sound{background:#16a97d}.clip.sel{outline:3px solid #fff;outline-offset:2px}.bars{opacity:.55;letter-spacing:1px;font-size:21px;white-space:nowrap}.empty{height:70px;display:grid;place-items:center;color:#9297a2}.add{width:100%;min-height:58px;margin-top:14px;border:1px dashed #51555f;background:transparent;border-radius:14px;color:#d5d8df;font-weight:800}.hint{text-align:center;color:#858b96;font-size:12px;margin-top:12px}.editor{display:none;position:fixed;left:0;right:0;bottom:94px;background:#1c1e24;border-top:1px solid #343740;padding:10px 12px;z-index:20}.editor.show{display:block}.editin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.editor button{min-height:52px;background:#292c34;border-radius:13px;font-size:12px;font-weight:800}.editor input{width:100%;grid-column:1/-1}.tools{position:fixed;bottom:0;left:0;right:0;background:#141519f5;backdrop-filter:blur(16px);border-top:1px solid #30323a;padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:30}.toolsin{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:10px;align-items:center}.transport{height:58px;border-radius:18px;background:#292c33;font-size:23px}.record{height:72px;border-radius:23px;background:#ff3c50;font-weight:900}.record b{display:block;font-size:22px}.toast{display:none;position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:#fff;color:#111;border-radius:20px;padding:10px 16px;font-weight:750;z-index:50;white-space:nowrap}.recording .quick,.recording .add{pointer-events:none;opacity:.3}.recording .record{background:#fff;color:#111}#file{display:none}@media(min-width:700px){.app{padding-left:22px;padding-right:22px}}
</style></head><body><main class="app" id="app"><header><div class="brand">Montage Son</div><button class="export" id="export">Exporter WAV</button></header><div class="time" id="clock">00:00.0</div><div class="quick"><button id="undo">↶ Annuler</button><button id="minus">− Zoom</button><button id="plus">＋ Zoom</button></div><section class="timeline" id="timeline"><div class="canvas" id="canvas"><div class="playhead" id="playhead"></div><div class="ruler"><span>0:00</span><span>0:15</span><span>0:30</span><span>0:45</span><span>1:00</span></div><div class="track"><div class="head"><span>🎙️ VOIX</span><span>touche pour modifier</span></div><div class="lane" id="voice"><div class="empty">Ta voix apparaîtra ici</div></div></div><div class="track"><div class="head"><span>🎵 SONS</span><span>glisse pour déplacer</span></div><div class="lane" id="sounds"><div class="empty">Ajoute musique ou bruitage</div></div></div><button class="add" id="add">＋ Ajouter musique / bruitage</button><input id="file" type="file" accept="audio/*" multiple><div class="hint">Conseil : utilise des écouteurs pendant l'enregistrement</div></div></section></main><div class="editor" id="editor"><div class="editin"><button id="left">← Début</button><button id="right">Fin →</button><button id="mute">🔊 Muet</button><button id="del">🗑 Supprimer</button><input id="vol" type="range" min="0" max="150" value="100"></div></div><div class="toast" id="toast"></div><nav class="tools"><div class="toolsin"><button class="transport" id="back">↶ 5s</button><button class="record" id="record"><b>●</b>ENREGISTRER</button><button class="transport" id="play">▶</button></div></nav><script>
const $=s=>document.querySelector(s),ctx=new (window.AudioContext||window.webkitAudioContext)();let clips=[],selected=null,recorder,chunks=[],recording=false,playing=false,cursor=0,zoom=1,t0=0,tick,history=[];
const msg=s=>{let e=$('#toast');e.textContent=s;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',1700)},fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+(s%60).toFixed(1).padStart(4,'0');
function duration(){return Math.max(60,...clips.map(c=>c.start+c.len))}function save(){history.push(clips.map(c=>({...c,buffer:c.buffer})));if(history.length>12)history.shift()}
function render(){let d=duration(),w=Math.max(100,d/60*100*zoom);$('#canvas').style.width=w+'%';for(let [lane,type] of [[$('#voice'),'voice'],[$('#sounds'),'sound']]){lane.innerHTML='';let a=clips.filter(c=>c.type===type);if(!a.length)lane.innerHTML='<div class="empty">'+(type==='voice'?'Ta voix apparaîtra ici':'Ajoute musique ou bruitage')+'</div>';a.forEach(c=>{let e=document.createElement('div');e.className='clip '+(type==='sound'?'sound ':'')+(selected===c?'sel':'');e.style.left=(c.start/d*100)+'%';e.style.width=Math.max(4,c.len/d*100)+'%';e.innerHTML='<span class="bars">'+(type==='voice'?'▂▅▇▃▆▂▇▅▃▆▇▂▅':'♪ '+c.name.slice(0,16))+'</span>';e.onclick=x=>{x.stopPropagation();selected=c;$('#editor').classList.add('show');$('#vol').value=c.gain*100;render()};drag(e,c,d);lane.appendChild(e)})}$('#playhead').style.left=(cursor/d*100)+'%';$('#clock').textContent=fmt(cursor)}
function drag(el,c,d){let sx,orig;el.onpointerdown=e=>{sx=e.clientX;orig=c.start;el.setPointerCapture(e.pointerId)};el.onpointermove=e=>{if(sx==null)return;c.start=Math.max(0,orig+(e.clientX-sx)/$('#canvas').getBoundingClientRect().width*d);render()};el.onpointerup=()=>{sx=null}}
async function decode(blob){return await ctx.decodeAudioData(await blob.arrayBuffer())}
$('#add').onclick=()=>$('#file').click();$('#file').onchange=async e=>{save();for(const f of e.target.files){try{let b=await decode(f);clips.push({id:crypto.randomUUID(),type:'sound',name:f.name,buffer:b,start:cursor,trim:0,len:b.duration,gain:1,muted:false})}catch{msg('Format audio non reconnu')}}render();e.target.value=''};
async function record(){if(recording){recorder.stop();return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);let recStart=cursor;recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());try{let b=await decode(new Blob(chunks,{type:recorder.mimeType}));save();clips.push({id:crypto.randomUUID(),type:'voice',name:'Voix',buffer:b,start:recStart,trim:0,len:b.duration,gain:1,muted:false});render()}catch{msg("Impossible de relire cette prise")}recording=false;$('#app').classList.remove('recording');$('#record').innerHTML='<b>●</b>ENREGISTRER';stopPlay();msg('Prise enregistrée ✓')};recorder.start();recording=true;$('#app').classList.add('recording');$('#record').innerHTML='<b>■</b>STOP';play(recStart,true)}catch(e){msg('Autorise le microphone pour enregistrer')}}
$('#record').onclick=record;function stopPlay(){playing=false;clearInterval(tick);if(window.sources)window.sources.forEach(s=>{try{s.stop()}catch{}});window.sources=[];$('#play').textContent='▶'}
function play(from=cursor,monitor=false){stopPlay();ctx.resume();window.sources=[];let now=ctx.currentTime;clips.forEach(c=>{if(c.muted)return;let off=Math.max(0,from-c.start),remain=c.len-off;if(remain<=0)return;let s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=c.buffer;g.gain.value=c.gain;s.connect(g).connect(ctx.destination);s.start(now+Math.max(0,c.start-from),c.trim+off,remain);window.sources.push(s)});playing=true;t0=performance.now()-from*1000;tick=setInterval(()=>{cursor=(performance.now()-t0)/1000;render();if(cursor>duration())stopPlay()},80);if(!monitor)$('#play').textContent='⏸'}
$('#play').onclick=()=>playing?stopPlay():play();$('#back').onclick=()=>{cursor=Math.max(0,cursor-5);render()};$('#timeline').onclick=e=>{if(e.target.closest('.clip,.add'))return;let r=$('#canvas').getBoundingClientRect();cursor=Math.max(0,Math.min(duration(),(e.clientX-r.left)/r.width*duration()));render()};
$('#plus').onclick=()=>{zoom=Math.min(6,zoom*1.35);render()};$('#minus').onclick=()=>{zoom=Math.max(1,zoom/1.35);render()};$('#undo').onclick=()=>{if(!history.length)return msg('Rien à annuler');clips=history.pop();selected=null;$('#editor').classList.remove('show');render()};
$('#del').onclick=()=>{if(!selected)return;save();clips=clips.filter(c=>c!==selected);selected=null;$('#editor').classList.remove('show');render()};$('#mute').onclick=()=>{if(selected){selected.muted=!selected.muted;msg(selected.muted?'Piste muette':'Son rétabli')}};
$('#vol').oninput=e=>{if(selected)selected.gain=e.target.value/100};$('#left').onclick=()=>{if(!selected||selected.len<.3)return;save();selected.trim+=.25;selected.len-=.25;render()};$('#right').onclick=()=>{if(!selected||selected.len<.3)return;save();selected.len-=.25;render()};
function wav(ab){let n=ab.length,ch=ab.numberOfChannels,sr=ab.sampleRate,b=new ArrayBuffer(44+n*ch*2),v=new DataView(b),p=0;let str=s=>{for(let x of s)v.setUint8(p++,x.charCodeAt(0))},u16=x=>{v.setUint16(p,x,true);p+=2},u32=x=>{v.setUint32(p,x,true);p+=4};str('RIFF');u32(36+n*ch*2);str('WAVEfmt ');u32(16);u16(1);u16(ch);u32(sr);u32(sr*ch*2);u16(ch*2);u16(16);str('data');u32(n*ch*2);for(let i=0;i<n;i++)for(let c=0;c<ch;c++){let x=Math.max(-1,Math.min(1,ab.getChannelData(c)[i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([b],{type:'audio/wav'})}
$('#export').onclick=async()=>{if(!clips.length)return msg('Il n’y a encore rien à exporter');msg('Préparation du fichier…');let sr=44100,d=duration(),o=new OfflineAudioContext(2,Math.ceil(d*sr),sr);clips.forEach(c=>{if(c.muted)return;let s=o.createBufferSource(),g=o.createGain();s.buffer=c.buffer;g.gain.value=c.gain;s.connect(g).connect(o.destination);s.start(c.start,c.trim,c.len)});let out=await o.startRendering(),a=document.createElement('a');a.href=URL.createObjectURL(wav(out));a.download='montage-son.wav';a.click();msg('Montage exporté ✓')};render();
</script></body></html>
